[package]
name = "ai-core"
description = "Provider-neutral AI completion contracts, service, and deterministic fake provider."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Schema generation is development tooling: the binary and the `schema` module
# are gated on `schema-tool`, so the library's own API never exposes a
# `serde_json` type. The crate is not a direct runtime dependent of serde_json,
# though `schemars` pulls it in transitively regardless — the gate buys a clean
# public surface, not a smaller graph.
[features]
schema-tool = ["dep:serde_json"]

[dependencies.serde_json]
workspace = true
optional = true

[[bin]]
name = "ai-schema"
path = "src/bin/ai-schema.rs"
required-features = ["schema-tool"]

[lints]
workspace = true
