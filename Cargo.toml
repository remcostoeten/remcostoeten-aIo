[workspace]
members = ["crates/ai-core", "crates/ai-providers"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/remcostoeten/remcostoeten-aIo"

[workspace.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
